    // Phone validation constants &amp; strict mask helpers: +375(XX)XXX-XX-XX
    const VALID_OPERATOR_CODES = ['25', '29', '33', '44'];

    function extractPhoneDigits(value) {
      let raw = (value || '').replace(/\D/g, '');
      if (raw.startsWith('80') &amp;&amp; raw.length >= 4) {
        raw = '375' + raw.slice(2);
      } else if (raw.startsWith('8') &amp;&amp; raw.length >= 3 &amp;&amp; !raw.startsWith('80')) {
        raw = '375' + raw.slice(1);
      }
      return raw;
    }

    // Strict formatting: +375(XX)XXX-XX-XX
    function formatBelarusPhoneStrict(inputVal) {
      let raw = extractPhoneDigits(inputVal);

      if (!raw.startsWith('375')) {
        if (raw.startsWith('37')) raw = '375';
        else if (raw.startsWith('3')) raw = '375';
        else raw = '375' + raw;
      }

      // 375 + 9 national digits (total 12)
      const national = raw.slice(3, 12);
      let formatted = '+375(';

      if (national.length > 0) {
        const code = national.slice(0, 2);
        if (national.length <= 2) {
          formatted += code;
        } else {
          formatted += `${code})`;
          const part1 = national.slice(2, 5);
          formatted += part1;
          if (national.length > 5) {
            const part2 = national.slice(5, 7);
            formatted += `-${part2}`;
            if (national.length > 7) {
              const part3 = national.slice(7, 9);
              formatted += `-${part3}`;
            }
          }
        }
      }

      return formatted;
    }

    function getNormalizedPhone(value) {
      let raw = extractPhoneDigits(value);
      if (!raw.startsWith('375')) raw = '375' + raw;
      const full = raw.slice(0, 12);
      return full.length >= 4 ? '+' + full : '+375';
    }

    function validateBelarusianPhone(value) {
      const raw = extractPhoneDigits(value);
      if (!raw.startsWith('375')) {
        return { isValid: false, codeValid: false, count: 0, code: '' };
      }
      const national = raw.slice(3, 12);
      const code = national.slice(0, 2);
      const isCodeComplete = code.length === 2;
      const isCodeValid = isCodeComplete ? VALID_OPERATOR_CODES.includes(code) : true;
      const isFullyValid = national.length === 9 &amp;&amp; VALID_OPERATOR_CODES.includes(code);

      return {
        isValid: isFullyValid,
        codeValid: isCodeValid,
        nationalLength: national.length,
        code: code
      };
    }

      } else if (isValid) {

    function setNextBtnEnabled(enabled) {
      if (enabled) {
        nextBtn.removeAttribute('disabled');
        nextBtn.classList.remove('opacity-40', 'pointer-events-none');
        nextBtn.classList.add('cursor-pointer');
      } else {
        nextBtn.setAttribute('disabled', 'true');
        nextBtn.classList.add('opacity-40', 'pointer-events-none');
        nextBtn.classList.remove('cursor-pointer');
      }
    }

    function checkValidationForCurrentStep() {
      if (quizState.step === 1) {
        setNextBtnEnabled(Boolean(quizState.carBrand));
      } else if (quizState.step === 2) {
        setNextBtnEnabled(Boolean(quizState.carModel || quizState.isModelUnknown));
      } else if (quizState.step === 3) {
        setNextBtnEnabled(Boolean(quizState.carGen || quizState.isGenUnknown));
      } else if (quizState.step === 4) {
        const plateVal = document.getElementById('plateInput').value.trim();
        const noPlate = document.getElementById('noPlateCheckbox').checked;
        setNextBtnEnabled(Boolean(plateVal || noPlate));
      } else if (quizState.step === 5) {
        setNextBtnEnabled(Boolean(quizState.phoneBrand));
      } else if (quizState.step === 6) {
        setNextBtnEnabled(Boolean(quizState.phoneModel || quizState.isPhoneModelUnknown));
      } else if (quizState.step === 7) {
        const isNameValid = contactNameInput.value.trim().length > 0;
        const isPhoneValid = applyPhoneValidationUI();
        setNextBtnEnabled(isNameValid &amp;&amp; isPhoneValid);
      }
    }

    // Render Steps
    function renderStep(step) {
      quizState.step = step;

      document.querySelectorAll('.quiz-step').forEach(el => el.classList.add('hidden'));

      if (step <= 7) {
        const currentSection = document.getElementById('step-' + step);
        if (currentSection) currentSection.classList.remove('hidden');

        currentStepNumEl.textContent = step;
        const percent = Math.round((step / 7) * 100);
        progressFill.style.width = percent + '%';

        stepCounterEl.classList.remove('hidden');
        trustBanner.classList.remove('hidden');
        progressBarWrapper.classList.remove('hidden');
        quizFooter.classList.remove('hidden');

        if (step === 1) {
          prevBtnText.textContent = 'Отмена';
          nextBtnText.textContent = 'Далее';
          nextBtnIcon.classList.remove('hidden');
        } else if (step === 7) {
          prevBtnText.textContent = 'Назад';
          nextBtnText.textContent = 'Отправить заявку ›';
          nextBtnIcon.classList.add('hidden');
          updateStep7Summary();
        } else {
          prevBtnText.textContent = 'Назад';
          nextBtnText.textContent = 'Далее';
          nextBtnIcon.classList.remove('hidden');
        }

        checkValidationForCurrentStep();

      } else {
        // Step 8: Success
        const successSection = document.getElementById('step-success');
        if (successSection) successSection.classList.remove('hidden');

        stepCounterEl.innerHTML = '<span class=&quot;text-accent-success flex items-center gap-1 font-bold&quot;>✓ ЗАЯВКА ПРИНЯТА</span>';
        trustBanner.classList.add('hidden');
        progressBarWrapper.classList.add('hidden');
        quizFooter.classList.add('hidden');

        updateSuccessContent();
      }

      document.getElementById('quizContent').scrollTop = 0;
    }

<script>
var __quizLastFocus=null;
function openQuiz(){
  var o=document.getElementById('quiz-overlay');
  if(!o)return;
  __quizLastFocus=document.activeElement;
  o.style.display='flex';
  document.body.style.overflow='hidden';
  try{
    var f=document.getElementById('quiz-frame');
    var tries=0;
    (function focusFrame(){
      if(!f)return;
      try{f.focus();}catch(_e){}
      if(document.activeElement!==f&&tries<10){tries++;setTimeout(focusFrame,150);}
    })();
  }catch(_e){}
}
function closeQuiz(){
  var o=document.getElementById('quiz-overlay');
  if(!o)return;
  o.style.display='none';
  document.body.style.overflow='';
  try{
    if(__quizLastFocus&&__quizLastFocus.focus&&document.contains(__quizLastFocus)){__quizLastFocus.focus();}
  }catch(_e){}
  __quizLastFocus=null;
}
(function(){
  var o=document.getElementById('quiz-overlay');
  if(!o)return;
  o.addEventListener('click',function(e){ if(e.target===o) closeQuiz(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'||e.key==='Esc') closeQuiz(); });
  // React 19 блокирует javascript:-URL и игнорирует строковые on*-пропсы,
  // поэтому CTA ловим делегированием по тексту (capture + preventDefault).
  var TEXTS=['заказать чехол','заказать в подарок','подобрать чехол','подобрать дизайн','подобрать подарок','начать подбор','хочу такой же','показать макет моего авто'];
  function isCTA(el){
    var t=(el.textContent||'').toLowerCase().replace(/\s+/g,' ');
    for(var i=0;i<TEXTS.length;i++){ if(t.indexOf(TEXTS[i])!==-1) return true; }
    return false;
  }
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest ? e.target.closest('a,button') : null;
    if(!el || el === o) return;
    var oc=el.getAttribute('onclick')||'';
    if(oc.indexOf('closeQuiz')!==-1) return;
    var dc=e.target.closest ? e.target.closest('[data-cta="quiz"]') : null;
    if(dc){ e.preventDefault(); openQuiz(); return; }
    if(!isCTA(el)) return;
    e.preventDefault();
    openQuiz();
  },true);
})();
</script>
